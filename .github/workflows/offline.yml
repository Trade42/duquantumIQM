name: Surface-code submission

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-replay:
    name: Core replay (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline core packages
        run: python -m pip install -e ".[test]" -e ./ethan
      - name: Reproduce Garnet and vanilla surface-code comparison
        run: python -m examples.reproduce
      - name: Check inference and raw-record invariants
        run: python -m pytest -q tests/test_submission.py tests/test_rounds_replay.py
