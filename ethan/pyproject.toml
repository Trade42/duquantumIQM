[project]
name = "ethan-iqm-surface-code"
version = "0.1.0"
description = "Calibration-aware no-reset surface-code memories for the IQM challenge"
requires-python = ">=3.11"
dependencies = ["stim>=1.16,<1.17", "pymatching>=2.4,<3", "numpy>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
qiskit = ["qiskit>=2.1,<3", "qiskit-aer>=0.17,<0.18"]
hardware = ["iqm-client[qiskit]==35.0.3", "iqm-pulla==14.0.3", "qiskit==2.1.2", "iqm-qubit-selector==1.1.3"]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["iqm_surface_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
