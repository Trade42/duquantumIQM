[project]
name = "duquantum-iqm-surface-code"
version = "0.1.0"
description = "Calibration-aware no-reset surface-code memories for the IQM challenge"
requires-python = ">=3.11"
dependencies = ["stim>=1.16,<1.17", "pymatching>=2.4,<3", "numpy>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
qiskit = ["qiskit>=2.1,<3", "qiskit-aer>=0.17,<0.18"]
hardware = ["iqm-client[qiskit]==35.0.3", "qiskit==2.1.2", "iqm-qubit-selector"]
test = ["pytest>=8,<10"]
decoders = ["torch>=2.5", "cotengra>=0.7", "kahypar"]  # TN sweep + NN; cotengra/kahypar for the cross-check
data = ["pandas>=2", "pyarrow>=15", "rustworkx>=0.15"]  # darawork.garnet_dataset

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["challenge*", "darawork*"]

[tool.pytest.ini_options]
testpaths = ["darawork/tests", "tests"]  # darawork first: its conftest loads torch before qiskit-aer
